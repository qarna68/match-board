<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>مباريات اليوم - ستوري</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  :root{
    --bg:#080e1f; --card:#111a33; --line:#243056;
    --text:#e8ecf8; --muted:#8a97bd;
    --accent:#00e0a4; --accent2:#ffd166; --live:#ff4d6d;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:'Cairo',system-ui,sans-serif;
    background:radial-gradient(1200px 600px at 20% -10%,#17224a 0%,var(--bg) 60%);
    color:var(--text); min-height:100vh; padding:16px;
  }
  .controls{max-width:640px;margin:0 auto 12px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .btn{
    background:var(--card); color:var(--text); border:1px solid var(--line);
    padding:10px 14px; border-radius:10px; cursor:pointer; font-family:inherit;
    font-size:13px; font-weight:700;
  }
  .btn:hover{background:#22305c}
  .btn.primary{background:linear-gradient(135deg,var(--accent),#00b386); color:#052018; border:0}
  .btn.toggle.active{background:var(--accent); color:#052018; border-color:var(--accent)}
  .btn:disabled{opacity:.6}
  .status-bar{
    max-width:640px;margin:0 auto 12px;text-align:center;
    font-size:13px;color:var(--muted); min-height:20px;
  }
  .story-frame{
    width:1080px; height:1920px;
    background:linear-gradient(170deg,#0a1229 0%,#080e1f 40%,#0d1530 100%);
    position:relative; overflow:hidden;
  }
  .story-frame::before{
    content:''; position:absolute; top:-200px; left:50%; transform:translateX(-50%);
    width:800px; height:600px;
    background:radial-gradient(ellipse,rgba(0,224,164,.12) 0%,transparent 70%);
  }
  .story-frame::after{
    content:''; position:absolute; bottom:-150px; left:50%; transform:translateX(-50%);
    width:700px; height:500px;
    background:radial-gradient(ellipse,rgba(255,209,102,.08) 0%,transparent 70%);
  }
  .story-inner{
    position:relative; z-index:1;
    padding: 200px 55px 80px 55px;
    height:100%; display:flex; flex-direction:column;
  }
  .story-header{text-align:center; margin-bottom:28px; flex-shrink:0}
  .story-header .date-label{
    display:inline-block; background:rgba(0,224,164,.12);
    color:var(--accent); font-size:22px; font-weight:700;
    padding:8px 24px; border-radius:999px; margin-bottom:14px;
    border:1px solid rgba(0,224,164,.25);
  }
  .story-header h1{margin:0; font-size:56px; font-weight:900; color:#fff}
  .story-header .sub{margin-top:10px; font-size:22px; color:var(--muted); font-weight:600}
  .matches-list{
    flex:1; display:flex; flex-direction:column; gap:12px;
    overflow:hidden; justify-content:center;
  }
  .match-card{
    background:linear-gradient(135deg,rgba(17,26,51,.95),rgba(26,36,68,.95));
    border:1px solid var(--line); border-radius:18px;
    padding:18px 22px; display:flex; align-items:center; gap:14px;
    position:relative; overflow:hidden;
  }
  .match-card::before{
    content:''; position:absolute; right:0; top:0; bottom:0; width:4px;
    background:linear-gradient(180deg,var(--accent),var(--accent2));
  }
  .match-card.priority::before{
    background:linear-gradient(180deg,#ffd166,#ff8fab);
  }
  .match-time{
    flex-shrink:0; text-align:center; min-width:96px;
    padding-left:14px; border-left:1px solid var(--line);
  }
  .match-time .t{
    font-size:30px; font-weight:800; color:var(--accent2);
    line-height:1.1; direction:ltr;
  }
  .match-time .ampm{font-size:14px; color:var(--muted); font-weight:700; margin-top:2px}
  .match-teams{flex:1; min-width:0}
  .team-row{display:flex; align-items:center; gap:10px; margin-bottom:6px}
  .team-row:last-child{margin-bottom:0}
  .team-logo{
    width:34px; height:34px; border-radius:50%; flex-shrink:0;
    background:#1a2444; display:grid; place-items:center;
    overflow:hidden; border:1px solid var(--line);
    font-size:14px; font-weight:800; color:#9fb0dd;
  }
  .team-logo img{width:100%;height:100%;object-fit:contain}
  .team-name{font-size:24px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .match-comp{
    flex-shrink:0; text-align:left; max-width:200px;
    font-size:13px; color:var(--muted); font-weight:600; line-height:1.4;
  }
  .other-count{
    text-align:center; margin-top:16px; padding:14px;
    background:rgba(17,26,51,.6); border:1px dashed var(--line);
    border-radius:14px; font-size:16px; color:var(--muted);
  }
  .other-count strong{color:var(--accent); font-size:22px; font-weight:800}
  .story-footer{
    flex-shrink:0; text-align:center; margin-top:20px;
    padding-top:18px; border-top:1px solid var(--line);
  }
  .story-footer .brand{font-size:18px; font-weight:800; color:var(--accent)}
  .story-footer .tag{font-size:13px; color:var(--muted); margin-top:4px}
  .empty-state{
    flex:1; display:flex; flex-direction:column; align-items:center;
    justify-content:center; color:var(--muted); gap:12px; font-size:22px;
  }
  .empty-state .icon{font-size:64px; opacity:.5}
  .preview-wrap{
    width:100%; max-width:400px; margin:0 auto;
    position:relative; overflow:hidden;
    border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,.5);
    background:#080e1f;
  }
  .preview-wrap .story-frame{
    position:absolute; top:0; right:0;
    transform-origin: top right;
  }
</style>
</head>
<body>

<div class="controls">
  <button class="btn toggle active" data-filter="big">🔥 كبار فقط</button>
  <button class="btn toggle" data-filter="priority">⭐ البطولات المهمة</button>
  <button class="btn toggle" data-filter="all">📋 الكل</button>
  <button class="btn" id="refreshBtn">↻</button>
  <button class="btn primary" id="downloadBtn">⬇ تحميل</button>
</div>
<div class="status-bar" id="statusBar">جارٍ التحميل...</div>

<div class="preview-wrap" id="previewWrap">
  <div class="story-frame" id="storyFrame">
    <div class="story-inner" id="storyInner">
      <div class="empty-state">
        <div class="icon">⚽</div>
        <div>جارٍ التحميل...</div>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   الإعدادات
   ============================================================ */
const CONFIG = {
  workerUrl: 'https://kooora-proxy.sajeeeni.workers.dev/?mode=matches',
  timezone: 'Asia/Riyadh',
  maxMatches: 8,

  // 🎯 البطولات المهمة — مطابقة دقيقة (يجب أن يحتوي اسم البطولة عليها)
  priorityCompetitions: [
    'كأس الخليج',
    'دوري روشن',
    'الدوري السعودي',
    'دوري أبطال آسيا',
    'دوري أبطال أوروبا',
    'الدوري الأوروبي',
    'دوري أبطال أفريقيا',
    'الدوري الإنجليزي الممتاز',
    'الدوري الإسباني',
    'الدوري الإيطالي',
    'الدوري الألماني',
    'الدوري الفرنسي',
    'الدوري المصري',
    'الدوري الإماراتي',
    'الدوري القطري',
    'الدوري الكويتي',
    'كأس العالم'
  ],

  // 🏆 أندية كبرى — تظهر حتى لو البطولة غير مصنّفة
  bigClubs: [
    'الهلال', 'النصر', 'الاتحاد', 'الأهلي',
    'ريال مدريد', 'برشلونة', 'أتلتيكو',
    'مانشستر سيتي', 'مانشستر يونايتد', 'ليفربول', 'تشيلسي', 'أرسنال', 'توتنهام',
    'بايرن ميونخ', 'دورتموند',
    'يوفنتوس', 'إنتر ميلان', 'ميلان', 'نابولي',
    'باريس سان جيرمان', 'مارسيليا',
    'الزمالك', 'الأهلي المصري'
  ],

  // 🚫 استبعاد بطولات (بأي جزء من الاسم)
  excludeCompetition: [
    'ودية', 'شباب', 'نساء', 'سيدات',
    'تحت 19', 'تحت 21', 'تحت 23', 'تحت 17', 'تحت 20',
    'U19', 'U21', 'U23', 'U17', 'U20',
    'الدرجة الثالثة', 'الدرجة الرابعة', 'الدرجة الخامسة',
    'أكاديمية', 'الأكاديمية', 'احتياط'
  ]
};

/* ============================================================
   أدوات
   ============================================================ */
const $ = id => document.getElementById(id);

function fmtTime(iso){
  try{
    const d = new Date(iso);
    if(isNaN(d)) return {t:'--:--', ampm:''};
    const s = d.toLocaleString('en-US', {
      timeZone: CONFIG.timezone, hour12:false, hour:'2-digit', minute:'2-digit'
    });
    const [h, m] = s.split(':').map(Number);
    const ampm = h >= 12 ? 'م' : 'ص';
    const h12 = (h % 12) || 12;
    const pad = n => String(n).padStart(2,'0');
    return { t: `${pad(h12)}:${pad(m)}`, ampm };
  }catch{ return {t:'--:--', ampm:''}; }
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

/* ============================================================
   منطق الفلترة — جديد وأدق
   ============================================================ */

// هل البطولة مستبعدة؟
function isExcluded(comp){
  return CONFIG.excludeCompetition.some(k => comp.includes(k));
}

// هل البطولة ذات أولوية؟
function isPriorityComp(comp){
  return CONFIG.priorityCompetitions.some(k => comp.includes(k));
}

// هل الفريق فريق احتياطي/أكاديمية/ثاني؟
function isReserveTeam(name){
  if(!name) return true;
  const n = name.trim();
  // ينتهي برقم (فيردر بريمن 2)
  if(/\s\d+$/.test(n)) return true;
  // يحتوي كلمات احتياط
  if(/\b(B|II|III|Reserve|Reserves|Academy|Youth|U\d+)\b/i.test(n)) return true;
  return false;
}

// هل المباراة "كبيرة" (فريق كبير أو نهائي كأس)؟
function isBigMatch(m){
  return CONFIG.bigClubs.some(c =>
    m.home.includes(c) || m.away.includes(c)
  );
}

// الفلترة الرئيسية
function applyFilter(mode){
  let list = ALL_MATCHES.filter(m => !isExcluded(m.competition));

  // استبعد الفرق الاحتياطية/الأكاديميات
  list = list.filter(m =>
    !isReserveTeam(m.home) && !isReserveTeam(m.away)
  );

  if(mode === 'big'){
    // كبار فقط: فريق كبير أو بطولة نهائية معروفة (أبطال أوروبا/آسيا)
    list = list.filter(m =>
      isBigMatch(m) ||
      m.competition.includes('دوري أبطال أوروبا') ||
      m.competition.includes('دوري أبطال آسيا') ||
      m.competition.includes('كأس الخليج')
    );
  } else if(mode === 'priority'){
    list = list.filter(m => isPriorityComp(m.competition) || isBigMatch(m));
  }
  // mode === 'all' → كل ما تبقى

  return list;
}

/* ============================================================
   الحالة
   ============================================================ */
let ALL_MATCHES = [];
let FILTER_MODE = 'big';

/* ============================================================
   جلب البيانات
   ============================================================ */
async function fetchMatches(){
  const res = await fetch(CONFIG.workerUrl);
  if(!res.ok) throw new Error('فشل الاتصال (' + res.status + ')');
  const json = await res.json();
  if(json.error) throw new Error(json.error);
  return json.matches || [];
}

/* ============================================================
   رسم الستوري
   ============================================================ */
function renderStory(){
  const inner = $('storyInner');
  const dateStr = new Date().toLocaleDateString('ar-EG', {
    weekday:'long', day:'numeric', month:'long'
  });

  let filtered = applyFilter(FILTER_MODE);

  // ترتيب
  filtered.sort((a, b) => {
    const pa = (isBigMatch(a) || isPriorityComp(a.competition)) ? 0 : 1;
    const pb = (isBigMatch(b) || isPriorityComp(b.competition)) ? 0 : 1;
    if(pa !== pb) return pa - pb;
    return new Date(a.startDate) - new Date(b.startDate);
  });

  const shown = filtered.slice(0, CONFIG.maxMatches);
  const remaining = filtered.length - shown.length;

  if(!shown.length){
    inner.innerHTML = `
      <div class="empty-state">
        <div class="icon">⚽</div>
        <div>لا توجد مباريات في هذه الفئة</div>
      </div>`;
    updatePreviewScale();
    return;
  }

  const rows = shown.map(m => {
    const {t, ampm} = fmtTime(m.startDate);
    const isBig = isBigMatch(m);
    const prioClass = isBig ? ' priority' : '';
    const homeLogo = m.homeLogo
      ? `<img src="${m.homeLogo}" crossorigin="anonymous" alt="">`
      : escapeHtml(m.home?.[0] || '?');
    const awayLogo = m.awayLogo
      ? `<img src="${m.awayLogo}" crossorigin="anonymous" alt="">`
      : escapeHtml(m.away?.[0] || '?');
    return `
      <div class="match-card${prioClass}">
        <div class="match-time">
          <div class="t">${t}</div>
          <div class="ampm">${ampm}</div>
        </div>
        <div class="match-teams">
          <div class="team-row">
            <div class="team-logo">${homeLogo}</div>
            <div class="team-name">${escapeHtml(m.home)}</div>
          </div>
          <div class="team-row">
            <div class="team-logo">${awayLogo}</div>
            <div class="team-name">${escapeHtml(m.away)}</div>
          </div>
        </div>
        <div class="match-comp">${escapeHtml(m.competition)}</div>
      </div>`;
  }).join('');

  const remainingHtml = remaining > 0
    ? `<div class="other-count">و <strong>${remaining}</strong> مباراة أخرى</div>`
    : '';

  inner.innerHTML = `
    <div class="story-header">
      <div class="date-label">📅 ${dateStr}</div>
      <h1>مباريات اليوم</h1>
      <div class="sub">${filtered.length} مباراة — توقيت السعودية</div>
    </div>
    <div class="matches-list">${rows}</div>
    ${remainingHtml}
    <div class="story-footer">
      <div class="brand">⚽ جدول المباريات</div>
      <div class="tag">kooora.com</div>
    </div>`;

  updatePreviewScale();
}

/* ============================================================
   حجم المعاينة
   ============================================================ */
function updatePreviewScale(){
  const wrap  = $('previewWrap');
  const frame = $('storyFrame');
  const availW = wrap.clientWidth;
  const scale  = availW / 1080;
  frame.style.transform = `scale(${scale})`;
  wrap.style.height = (1920 * scale) + 'px';
}
window.addEventListener('resize', updatePreviewScale);
window.addEventListener('orientationchange', () => setTimeout(updatePreviewScale, 200));

/* ============================================================
   التحميل
   ============================================================ */
async function load(){
  const status = $('statusBar');
  status.textContent = '⏳ جارٍ الجلب من كووورة...';

  try{
    ALL_MATCHES = await fetchMatches();
    const big = applyFilter('big').length;
    const prio = applyFilter('priority').length;
    status.textContent = `✅ ${ALL_MATCHES.length} مباراة — كبار: ${big} — مهمة: ${prio}`;
    renderStory();
  }catch(err){
    status.textContent = '⚠️ ' + err.message;
    $('storyInner').innerHTML = `
      <div class="empty-state">
        <div class="icon">⚠️</div>
        <div style="font-size:20px">${escapeHtml(err.message)}</div>
      </div>`;
    updatePreviewScale();
  }
}

/* ============================================================
   التصدير
   ============================================================ */
async function downloadStory(){
  const frame = $('storyFrame');
  const btn = $('downloadBtn');
  btn.textContent = '⏳ جارٍ التصدير...';
  btn.disabled = true;

  const saved = frame.style.transform;
  frame.style.transform = 'none';

  try{
    const canvas = await html2canvas(frame, {
      width: 1080, height: 1920, scale: 1,
      backgroundColor: '#080e1f', useCORS: true, logging: false
    });
    canvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `matches-${new Date().toISOString().slice(0,10)}.png`;
      a.click();
      URL.revokeObjectURL(url);
      btn.textContent = '✅ تم';
      setTimeout(()=>{ btn.textContent = '⬇ تحميل'; btn.disabled = false; }, 2000);
    }, 'image/png', 0.95);
  }catch(err){
    alert('فشل التصدير: ' + err.message);
    btn.textContent = '⬇ تحميل';
    btn.disabled = false;
  }finally{
    frame.style.transform = saved;
  }
}

/* ============================================================
   التهيئة
   ============================================================ */
document.querySelectorAll('.btn.toggle').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.btn.toggle').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    FILTER_MODE = btn.dataset.filter;
    renderStory();
  });
});
$('refreshBtn').addEventListener('click', load);
$('downloadBtn').addEventListener('click', downloadStory);

load();
</script>
</body>
</html>
